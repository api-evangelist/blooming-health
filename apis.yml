aid: blooming-health
name: Blooming Health
description: >-
  Blooming Health is an AI-powered, omnichannel care-management and community-engagement
  platform for healthcare and social-services organizations. It lets teams design multilingual
  care workflows across voice, SMS, and email in minutes — automating screening and needs
  assessments, service recommendations, outreach, appointment reminders, wellness check-ins,
  emergency broadcasts, closed-loop referral tracking, and Medicaid/SNAP recertification.
  The platform integrates with existing EHR/CRM systems and databases via FHIR, HL7, API, and
  SFTP, and is HIPAA compliant with encryption in transit and at rest, role-based access
  controls, audit trails, BAAs, and SOC 2 documentation available on request. Blooming Health
  is a healthcare portfolio company of Insight Partners. It exposes an enterprise integration
  surface but publishes no public developer portal or API reference.
